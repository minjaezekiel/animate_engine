<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { buildComposer } from './src/render/post3d.js';
import { samplePostAt } from './src/core/script/post.js';
import { matchVisemeMorphs } from './src/core/art/visemeMorphs.js';
import { getTrack } from './src/core/anim/Timeline.js';
import { trackValueAt } from './src/core/anim/Track.js';
import { clipToTracks } from './src/backends/three3d/clipToTracks.js';
import { createClip } from './src/core/anim/Clip.js';
import { createTrack, setKey } from './src/core/anim/Track.js';
import { compileFilm3D } from './src/core/script/compile3d.js';
import { retimeToAudio } from './src/core/script/screenplay.js';
import { buildScene3D, buildTextures } from './src/backends/three3d/SceneAdapter.js';
import { createThreePoser } from './src/backends/three3d/Three3DBackend.js';
import { samplePose } from './src/core/anim/Evaluator.js';
import { renderOffline } from './src/render/OfflineRenderer.js';
import { MediaRecorderSink } from './src/render/sinks/MediaRecorderSink.js';
import { MemorySink } from './src/render/sinks/MemorySink.js';
import { WebCodecsSink } from './src/render/sinks/WebCodecsSink.js';
import { mp4MuxerFactory } from './src/render/mux/Mp4Muxer.js';
import { loadAudioAssets } from './src/core/art/AssetRegistry.js';
import { renderMix, decodeAudio } from './src/audio/OfflineMixer.js';
import { createRegistry } from './src/core/voice/gateway.js';
import { createHttpTakeCache, webDigest } from './src/core/voice/takeCache.js';
import { audioBufferToWav } from './src/audio/wav.js';
import { synthesizeDialogue } from './src/core/voice/synthesize.js';
import { applyLipsync } from './src/core/art/humanoid3d.js';
import { key as writeKey } from './src/core/anim/Timeline.js';
import { paintTexture, normalFromHeight } from './src/core/art/textures.js';
import { overlayAt, subtitleSpans, checkOverlay } from './src/core/art/overlay.js';
import { transitionOps, checkTransitions, blendAt } from './src/core/art/transitions.js';
import { frameDigest, dominantHue } from './src/core/script/digest.js';
import { createCompositeCanvas, createProjector, createMeasurer } from './src/render/Overlay2D.js';

/**
 * Render a 3D film script to a video, headless.
 *
 * Deliberately not a UI. The 2D path has film.html for authoring; this exists
 * so the 3D compiler can be driven by a script and a test, which is what the
 * live test needs. A studio surface is a separate job.
 *
 * # What this page learned from the 2D one
 *
 * It was written as a small sibling of `film.html` and then diverged, and the
 * divergence was all in one direction: every capability the 2D path grew
 * after Phase 14 was added there and not here. The Earth test found five of
 * them in one render -- no MP4, no subtitles, no voice levelling, no
 * retiming, and voice models re-downloaded from a CDN on every run. None was
 * a missing mechanism. All five were a call nobody had made.
 */
function coreClip(clip) {
    const { tracks, skipped } = clipToTracks(clip);
    const built = [];
    for (const t of tracks) {
        const track = createTrack({ target: t.target, path: t.path, type: t.type });
        for (const k of t.keys) setKey(track, k.t, k.v, k.ease ?? 'linear');
        built.push(track);
    }
    return { clip: createClip({ id: clip.name, name: clip.name, duration: clip.duration,
                                loop: 'repeat', tracks: built }), skipped };
}

/**
 * Fetch every model the film declares, before anything is compiled.
 *
 * Before compiling, because the compiler has to know which node names and
 * which animations the file actually contains in order to say so when a film
 * animates one that is not there. A failure is reported and the film carries
 * on without that model: one missing prop should not take a render down.
 */
async function loadModels(film, report) {
    const out = {};
    for (const [id, spec] of Object.entries(film.models ?? {})) {
        if (!spec?.src) continue;
        try {
            const fbx = /\.fbx($|\?)/i.test(spec.src);
            const loaded = await (fbx ? new FBXLoader() : new GLTFLoader()).loadAsync(spec.src);
            const scene = loaded.scene ?? loaded;
            const animations = loaded.animations ?? scene.animations ?? [];
            const nodes = [];
            scene.traverse((o) => { if (o.name) nodes.push(o.name); });
            const clips = [];
            let skipped = 0;
            for (const a of animations) {
                const made = coreClip(a);
                skipped += made.skipped.length;
                clips.push(made.clip);
            }
            out[id] = { scene, nodes, clips, animations };
            report(`model ${id}: ${nodes.length} named nodes, ${clips.length} clips`
                + (skipped ? `, ${skipped} tracks skipped` : ''));
        } catch (e) {
            report(`[model] ${id} (${spec.src}) failed to load: ${e.message}`);
        }
    }
    return out;
}

/**
 * Find a named mesh with morph targets inside a loaded model.
 *
 * By name first, because that is what the film declared. Falling back to the
 * only morph-bearing mesh in the model is deliberate and narrow: if there is
 * exactly ONE candidate there is nothing to get wrong, and a great many
 * exported heads name that mesh something nobody would guess. With two or
 * more the author has to say which, because picking the one with the most
 * targets would be right often enough to be trusted and wrong often enough
 * to waste an afternoon.
 */
function findMorphMesh(models, node) {
    const candidates = [];
    let named = null;
    for (const loaded of Object.values(models ?? {})) {
        loaded.scene?.traverse?.((o) => {
            if (!o.morphTargetDictionary || !o.morphTargetInfluences) return;
            candidates.push(o);
            if (o.name === node && !named) named = o;
        });
    }
    return named ?? (candidates.length === 1 ? candidates[0] : null);
}

/**
 * An HDR or image panorama, for image-based lighting -- or the built-in
 * studio, which is the default whenever a film contains a metal.
 *
 * `RoomEnvironment` is a handful of emissive boxes, so there is nothing to
 * download and nothing to go stale; `PMREMGenerator` prefilters it into the
 * roughness mip chain a `MeshStandardMaterial` actually samples, which an
 * equirectangular PNG would have had to be put through anyway.
 */
async function loadEnvironment(spec, report, renderer) {
    if (!spec) return null;
    if (spec.builtin) {
        const pmrem = new THREE.PMREMGenerator(renderer);
        const texture = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
        pmrem.dispose();
        report(`environment: built-in studio at ${spec.intensity}x`
            + ` (no film declared one, and this one has metal in it)`);
        return texture;
    }
    try {
        const hdr = /\.hdr($|\?)/i.test(spec.src);
        const texture = await (hdr ? new RGBELoader() : new THREE.TextureLoader())
            .loadAsync(spec.src);
        texture.mapping = THREE.EquirectangularReflectionMapping;
        report(`environment: ${spec.src}${spec.background ? ' (also the sky)' : ''}`);
        return texture;
    } catch (e) {
        report(`[environment] ${spec.src} failed to load: ${e.message}`);
        return null;
    }
}

/** Only the textures that come off the network; the rest are synthesized. */
async function loadTextureImages(textures, report) {
    const out = {};
    const loader = new THREE.TextureLoader();
    for (const [id, spec] of Object.entries(textures ?? {})) {
        if (!spec.src) continue;
        try {
            out[id] = await loader.loadAsync(spec.src);
            report(`texture ${id}: ${spec.src}`);
        } catch (e) {
            report(`[texture] ${id} (${spec.src}) failed to load: ${e.message}`);
        }
    }
    return out;
}

window.render3d = async function render3d(film, opts = {}) {
    const width = opts.width ?? film.meta?.width ?? 1280;
    const height = opts.height ?? film.meta?.height ?? 720;
    const report = (m) => (window.report ? window.report(m) : console.log(m));
    const models = await loadModels(film, report);
    /**
     * Anything that is not producing a finished film skips synthesis.
     *
     * `digest` is on this list for the same reason `check` is: the first run
     * of it spent sixty seconds synthesising nine lines of dialogue in order
     * to report nine bounding boxes. Subtitle spans still appear in the
     * digest -- `subtitleSpans` falls back to a word-rate estimate when there
     * is no audio -- which is close enough to answer "what caption is on
     * screen here" and costs nothing.
     */
    const quiet = opts.probe || opts.silent || opts.mute || opts.grab || opts.check
        || opts.where || opts.digest;

    let working = film;
    let compiled = compileFilm3D(working, { models });
    for (const d of compiled.diagnostics) report(`[${d.severity}] ${d.message} @ ${d.location ?? '-'}`);

    // ----------------------------------------------------------------- voice
    /**
     * Dialogue, then RETIME, then compile again.
     *
     * `retimeToAudio` walks `scenes[].shots[].dialogue[]` and grows a shot
     * that is shorter than the speech inside it. It has existed since the
     * screenplay phase, the 2D studio has always called it, and it is
     * entirely shape-compatible with a 3D film -- which nobody had noticed,
     * so a 3D shot authored at 4 s with 5.2 s of dialogue in it simply cut
     * the line off mid-word at the cut. Two of the four spoken shots in the
     * Earth test did exactly that on the first render.
     */
    const cues = [...(compiled.audioCues ?? [])];
    let voiceBuffers = {};
    let voiced = null;
    if (compiled.lipsyncJobs?.length && !quiet) {
        const registry = createRegistry({
            decode: (b) => decodeAudio(b, 48000),
            sampleRate: 48000,
            backend: opts.voiceBackend ?? null,
            ttsModuleUrl: opts.ttsModuleUrl ?? null,
            voiceStudioUrl: opts.voiceStudioUrl ?? null,
            kokoroUrl: opts.kokoroUrl ?? null,
            openVoiceUrl: opts.openVoiceUrl ?? null,
            onProgress: (p) => report(`voice model: ${p.loaded ?? ''}/${p.total ?? ''} ${p.url ?? ''}`),
            report,
        });
        /**
         * Baked takes, so a second render synthesizes nothing.
         *
         * `crypto.subtle` needs a secure context and `http://127.0.0.1` is
         * one by specification, which is the origin every render here is
         * served from. Where it is absent -- a page opened as `file://` --
         * `webDigest()` returns null and the cache is simply off, because a
         * cache is an optimisation and must never be a requirement.
         */
        const digest = webDigest();
        const takeCache = (opts.takeCache === false || !digest) ? null
            : createHttpTakeCache({
                digest, decode: (b) => decodeAudio(b, 48000),
                encodeWav: audioBufferToWav, report,
            });
        if (!takeCache) report('[take] cache off (no crypto.subtle, or disabled)');
        const synth = (jobs) => synthesizeDialogue({
            lipsyncJobs: jobs, registry, fps: compiled.meta.fps, takeCache,
            // The engine default is 0.06 RMS, about -24 dBFS, which is quiet
            // next to anything else in a feed. The 2D harness has passed a
            // louder target since Phase 32 and this page never did, so every
            // 3D film in the repo is mixed ~7 dB under its 2D siblings.
            voiceLevel: opts.voiceLevel ?? 0.14,
            allowVoiceFallback: !opts.strictVoice,
            onProgress: (p) => report(`voice ${p.done}/${p.total}: ${String(p.text).slice(0, 40)}`),
        });
        voiced = await synth(compiled.lipsyncJobs);
        for (const d of voiced.diagnostics) report(`[voice] ${d.message}`);
        for (const d of registry.diagnostics()) report(`[voice] ${d.message}`);
        if (takeCache) {
            const st = takeCache.stats();
            report(`[take] ${st.hits} cached, ${st.misses} synthesized, `
                + `${st.stored} written${st.failed ? `, ${st.failed} failed` : ''}`);
        }

        if (opts.retime !== false) {
            const durations = {};
            for (const job of compiled.lipsyncJobs) {
                const cue = voiced.cues.find((c) => c.id === `${job.nodeId}@${job.at}`);
                const buf = cue ? voiced.buffers[cue.assetId] : null;
                if (buf && job.text) durations[job.text] = buf.duration;
            }
            const { film: retimed, changed, changes } = retimeToAudio(working, durations,
                { shrink: film.meta?.estimatedTiming === true });
            if (changed > 0) {
                report(`retimed ${changed} shot(s) to the real audio: `
                    + changes.map((c) => `${c.shot ?? '?'} ${c.from}->${c.to}s`).join(', '));
                working = retimed;
                compiled = compileFilm3D(working, { models });
                // Re-key at the corrected offsets WITHOUT re-synthesizing:
                // the audio itself has not changed, only when it starts.
                voiced = await synth(compiled.lipsyncJobs);
            }
        }
        cues.length = 0;
        cues.push(...(compiled.audioCues ?? []), ...voiced.cues);
        voiceBuffers = voiced.buffers;
        /**
         * Resolve each declared imported head against the morph target names
         * the loaded model ACTUALLY has.
         *
         * The compiler knows which mesh is the face, because the author said
         * so; only the page knows what that mesh's blendshapes are called,
         * because only the page has loaded the file. So the matching happens
         * here, and it reports what it found -- a head with 52 morph targets
         * and no recognisable mouth shape is worth a line in the log rather
         * than a still face in the render.
         */
        const faces = {};
        for (const [who, face] of Object.entries(compiled.faces ?? {})) {
            const node = face.node.slice(face.node.indexOf('/') + 1);
            const mesh = findMorphMesh(models, node);
            if (!mesh) {
                report(`[lipsync] ${who}: no mesh named '${node}' with morph targets`);
                continue;
            }
            const mapping = matchVisemeMorphs(Object.keys(mesh.morphTargetDictionary ?? {}),
                                              { extra: face.visemes ?? null });
            report(`[lipsync] ${who}/${node}: ${mapping.reason}`);
            if (mapping.usable) faces[who] = { ...face, mapping };
        }
        const n = applyLipsync(compiled.timeline, voiced.tracks, writeKey,
                               Object.keys(faces).length ? { faces } : {});
        report(`lipsync: ${voiced.tracks.length} lines, ${n} mouth keys`);
    }

    const images = await loadTextureImages(compiled.textures, report);

    // The LTC lookup tables a RectAreaLight integrates against. Two small
    // data textures, built once; without them an area light renders black.
    RectAreaLightUniformsLib.init();

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(width, height, false);
    renderer.setPixelRatio(1);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.append(renderer.domElement);

    // After the renderer, because the built-in studio is prefiltered ON the
    // GPU rather than loaded from anywhere.
    const environment = await loadEnvironment(compiled.meta.environment, report, renderer);

    const textures = buildTextures(THREE, compiled.textures,
                                   { paintTexture, normalFromHeight, images });
    if (textures.size) report(`textures: ${[...textures.keys()].join(', ')}`);

    const built = buildScene3D(THREE, compiled, {
        width, height, mergeGeometries, models, environment, textures,
        geometries: { RoundedBoxGeometry },
        // `Object3D.clone` copies a skinned mesh and leaves it bound to the
        // ORIGINAL skeleton, so two characters from one file move as one.
        cloneModel: SkeletonUtils.clone,
    });
    // An orthographic camera has no `aspect`: its frame is its own left and
    // right, which `buildScene3D` already derived from this width and height.
    if (built.camera.isPerspectiveCamera) built.camera.aspect = width / height;
    built.camera.updateProjectionMatrix();

    /**
     * Clipping planes, global rather than per-material.
     *
     * `renderer.clippingPlanes` applies to every material in the scene with
     * no per-material opt-in, which for a sectioned view is what you want:
     * the cut goes through everything it passes through, including a part
     * added later that nobody remembered to mark.
     *
     * `localClippingEnabled` is switched on as well, so a material that
     * carries its own `clippingPlanes` is still honoured -- a cutaway often
     * wants the subject sectioned and the set left whole.
     */
    if (built.clipPlanes.length) {
        renderer.clippingPlanes = built.clipPlanes.map((c) => c.plane);
        renderer.localClippingEnabled = true;
        // Without this the half that was clipped away still casts its shadow,
        // and a sectioned planet sits in the shadow of the hemisphere that is
        // no longer there.
        renderer.clipShadows = built.clipPlanes.some((c) => c.shadows);
        report(`clipping: ${built.clipPlanes.length} plane(s)`
            + (renderer.clipShadows ? ', shadows clipped' : ''));
    }

    const post = buildComposer({
        THREE, renderer, scene: built.root, camera: built.camera, width, height,
        post: compiled.meta.post, bloom: null,
        EffectComposer, RenderPass, ShaderPass, OutputPass,
        UnrealBloomPass, SSAOPass, BokehPass, SMAAPass, GTAOPass,
        warn: (m, where) => report(`[post] ${m} @ ${where ?? '-'}`),
    });
    if (built.shadowFit) {
        const f = built.shadowFit;
        report(`shadows: ${f.mapSize}^2 over ${(f.extent * 2).toFixed(2)} units`
            + ` (${(f.texel * 1000).toFixed(1)} mm per texel), bias ${f.bias.toExponential(1)}`);
    }
    if (post) report(`post: ${post.passes.join(' -> ')} -> output`);
    {
        // One line per scatter, because the count is the claim: a scatter is
        // one InstancedMesh however many instances are in it, and the `draw:`
        // line below is what proves that rather than asserting it.
        const scatters = [...compiled.scene.byId.values()].filter((n) => n.kind === 'scatter');
        for (const n of scatters) {
            report(`scatter: ${n.id.replace('__scatter:', '')} -- `
                + `${n.props.points.length} instances on ${n.parentId}`);
        }
    }
    const composer = post?.composer ?? null;

    /**
     * Advance the lens for this frame: the grain seed, and any keyed post.
     *
     * One function used by all three render paths -- the sim path, the plain
     * path and the offline `beforeFrame` -- rather than three copies, because
     * a lens that moves in the preview and not in the file (or the reverse)
     * is a defect nobody would think to look for.
     */
    const keyedPost = post
        ? samplePostAt(compiled.timeline, 0, { getTrack, trackValueAt, chain: post.chain })
        : null;
    if (keyedPost) report(`post keyed: ${Object.keys(keyedPost).join(', ')}`);
    const postAt = (t) => {
        if (!post) return;
        post.setTime(t);
        // Only films that key post pay for the sample.
        if (keyedPost) {
            post.setParams(samplePostAt(compiled.timeline, t,
                { getTrack, trackValueAt, chain: post.chain }));
        }
    };

    // ---------------------------------------------------------------- overlay
    /**
     * Subtitles, titles and world-anchored callouts, composited after post.
     *
     * The composite canvas is what the sink is handed, so the render loop
     * needs no change: `backend.canvas()` returns the canvas that has the
     * overlay on it. See `render/Overlay2D.js` for why this is a canvas and
     * not a DOM layer, and why it is drawn after the post chain.
     */
    const overlay = compiled.meta.overlay;
    if (overlay) overlay.subtitles = subtitleSpans(compiled.lipsyncJobs, voiced);
    /**
     * Transitions share the composite, which is why they are drawn and not a
     * pass: a dip to colour is one `fillRect` on a context we already have.
     *
     * `drawn` is what decides whether the composite exists at all. It used to
     * be `overlay` alone, so a film with transitions and no captions would
     * have been handed the raw WebGL canvas and every transition would have
     * been missing from the file while looking fine in a preview -- the exact
     * failure shape `Overlay2D.js` was written to avoid.
     */
    const transitions = compiled.meta.transitions ?? [];
    const drawnTransitions = transitions.filter((t) => t.kind !== 'continue');
    /**
     * Motion blur joins the list of things that need a 2D surface.
     *
     * The accumulator averages subframes with `getImageData` and writes the
     * result back with `putImageData`, neither of which a WebGL canvas has.
     * The composite exists for exactly this sort of reason already -- an
     * overlay and a transition both need somewhere to draw over the render --
     * so blur asks for it the same way rather than inventing a second surface.
     */
    const drawn = !!overlay || drawnTransitions.length > 0;
    const composite = (drawn || compiled.meta.motionBlur)
        ? createCompositeCanvas(renderer.domElement, width, height) : null;
    const measure = composite ? createMeasurer(composite.ctx) : null;
    const project = composite
        ? createProjector(THREE, { camera: built.camera, resolve: built.resolve, width, height })
        : null;
    if (overlay) {
        report(`overlay: ${overlay.items.length} item(s), `
            + `${overlay.subtitles.length} subtitle span(s)`);
    }
    if (transitions.length) {
        report(`transitions: ${transitions.map((t) => `${t.kind}@${t.at}s`).join(', ')}`);
        for (const f of checkTransitions(transitions, compiled.shots,
                                         { duration: compiled.duration })) {
            report(`[transition] ${f.severity}: ${f.message}`);
        }
    }

    const sceneManager = {
        renderer, camera: built.camera,
        render: () => (composer ? composer.render() : renderer.render(built.root, built.camera)),
    };
    let frameTime = 0;
    /**
     * Draw calls, measured once, on the first frame.
     *
     * Every frame of a film draws the same objects, so one frame says what
     * all 1,200 of them cost -- and this is the only number that proves
     * instancing is doing what it claims. Four hundred cast nodes is four
     * hundred calls; four hundred instances of one scatter is one.
     */
    let reportedDraw = false;
    // `info` resets itself at the start of every `renderer.render`, and a
    // composer makes several per frame -- so without this the number read
    // back is the final full-screen quad, which is 1 call and 1 triangle
    // whatever the scene contains. First version of this line said exactly
    // that, proudly.
    renderer.info.autoReset = false;
    const backend = {
        capabilities: { kind: '3d', postFX: !!composer, overlay: !!overlay,
                        transitions: drawnTransitions.length },
        mount: () => backend, unmount() {}, sync: () => backend,
        resize: () => backend,
        renderFrame: () => {
            renderer.info.reset();
            sceneManager.render();
            if (!reportedDraw) {
                reportedDraw = true;
                const i = renderer.info.render;
                report(`draw: ${i.calls} calls, ${i.triangles} triangles per frame`
                    + (composer ? ` (including ${post.passes.length} post pass(es))` : ''));
            }
            if (composite) {
                // Transition ops LAST, so the colour is drawn over the type
                // rather than under it: a subtitle that stays legible through
                // a fade to black is the defect this ordering removes.
                composite.draw([
                    ...overlayAt(overlay, frameTime, { width, height, project, measure }),
                    ...transitionOps(drawnTransitions, frameTime, { width, height }),
                ]);
            }
            return backend;
        },
        canvas: () => (composite ? composite.canvas : renderer.domElement),
    };

    let audioBuffer = null;
    let audioContext = null;
    if (cues.length && !opts.probe && !opts.silent) {
        const { buffers, diagnostics } = await loadAudioAssets(film, { decode: decodeAudio });
        for (const d of diagnostics) report(`[audio] ${d.message}`);
        audioBuffer = await renderMix({
            cues, buffers: { ...buffers, ...voiceBuffers },
            durationSec: compiled.duration,
            duck: compiled.meta.duck,
            onReport: (m) => report(`[audio] ${m}`),
        });
        // The context is created and resumed HERE, before the recorder wants
        // it, rather than inside the sink mid-render. Left to the sink, the
        // stream's audio track produced nothing in headless and MediaRecorder
        // stalled waiting for it -- emitting a 110-byte header and no frames.
        audioContext = new AudioContext({ sampleRate: audioBuffer.sampleRate });
        if (audioContext.state === 'suspended') await audioContext.resume();
        report(`audio: ${cues.length} cues, `
             + `${audioBuffer.duration.toFixed(2)}s, ctx ${audioContext.state}`);
    }

    // Built AFTER lipsync has written its tracks: the poser snapshots the
    // channel list and each channel's authored value when it is created, so
    // a jaw track added later would never be reset between frames and frame
    // N would stop being a pure function of N for exactly the channels that
    // move most.
    const poser = createThreePoser({
        timeline: compiled.timeline, resolve: built.resolve, samplePose,
    });

    /**
     * Pose and step the scene so that time `t` is really showing.
     *
     * A single `step(t)` is enough for everything that is a closed form --
     * the camera's aim, the particles -- and wrong for anything simulated. A
     * cloth or a fluid is a function of the frames that came BEFORE it, so
     * jumping straight to t=4 shows a cape at its rest shape and a fluid with
     * nothing in it. Every grab and every check sampled a sim that had been
     * reset by its own jump, which looked like the simulation not working.
     *
     * So when the scene has sims, replay from zero at the film's own frame
     * rate -- which is exactly what the offline renderer does, and therefore
     * exactly the frame it would have produced.
     */
    const warmTo = (t) => {
        frameTime = t;
        poser.reset();
        if (!built.sims.length) { poser.apply(t); built.step(t); postAt(t); return; }
        const dt = 1 / compiled.meta.fps;
        for (let s = 0; s < t - 1e-9; s += dt) { poser.apply(s); built.step(s); }
        poser.apply(t); built.step(t); postAt(t);
    };

    // Where the backend actually put things, for when the analytic checks and
    // the rendered frame disagree about what is on screen.
    if (opts.where) {
        warmTo(opts.at ?? 0);
        built.root.updateMatrixWorld(true);
        const v = new THREE.Vector3();
        const out = {};
        for (const id of opts.where) {
            const o = built.resolve(id);
            out[id] = o ? o.getWorldPosition(v).toArray().map((n) => +n.toFixed(3)) : null;
        }
        out['#camera'] = built.camera.getWorldPosition(v).toArray().map((n) => +n.toFixed(3));
        out['#look'] = built.lookTarget.getWorldPosition(v).toArray().map((n) => +n.toFixed(3));
        poser.reset();
        return { where: out, duration: compiled.duration, diagnostics: [] };
    }

    // Exposure can only be measured on real pixels -- it depends on lights,
    // materials and tone mapping. Measured tiny (160x90 is 1/72 the pixels)
    // and judged by a pure function in core.
    if (opts.check) {
        const { lumaStats } = await import('./src/core/script/staging3d.js');
        const out = [];
        for (const { t, shotId } of opts.check) {
            warmTo(t);
            backend.renderFrame();
            const small = document.createElement('canvas');
            small.width = 160; small.height = 90;
            const c2 = small.getContext('2d');
            c2.drawImage(backend.canvas(), 0, 0, 160, 90);
            out.push({ t, shotId, ...lumaStats(c2.getImageData(0, 0, 160, 90).data) });
        }
        // Overlay findings need a projector and a measurer, which need a
        // canvas, which is why this runs here and not in `produce3d.mjs`
        // alongside the framing check.
        const overlayFindings = overlay
            ? checkOverlay(overlay, { width, height, fps: compiled.meta.fps,
                                      duration: compiled.duration, project, measure })
            : [];
        poser.reset();
        return { samples: out, overlay: overlayFindings,
                 transitions: checkTransitions(transitions, compiled.shots,
                                               { duration: compiled.duration }),
                 duration: compiled.duration, diagnostics: compiled.diagnostics };
    }

    /**
     * A frame DIGEST: what is on screen, as numbers, at a few times.
     *
     * The cheap half of looking. For each named subject it projects the
     * object's world bounds to screen space and samples the real rendered
     * pixels inside that box, so the answer to "is the planet lit" is a
     * number rather than an image. See `core/script/digest.js` for the
     * measurement that motivated it.
     *
     * Sampled on a 192x108 copy -- 1/100 of the pixels -- because every
     * statistic here is a mean over an area and none of them needs
     * resolution. The whole pass for nine times costs about as long as one
     * rendered frame.
     */
    if (opts.digest) {
        const box = new THREE.Box3();
        const v = new THREE.Vector3();
        const small = document.createElement('canvas');
        small.width = 192; small.height = 108;
        const c2 = small.getContext('2d', { willReadFrequently: true });
        const out = [];
        for (const { t, shotId, subjects: want } of opts.digest) {
            warmTo(t);
            backend.renderFrame();
            c2.drawImage(backend.canvas(), 0, 0, 192, 108);
            const img = c2.getImageData(0, 0, 192, 108).data;
            const lumaAt = (i) => (0.2126 * img[i] + 0.7152 * img[i + 1]
                                   + 0.0722 * img[i + 2]) / 255;
            const all = [];
            for (let i = 0; i < img.length; i += 4) all.push(lumaAt(i));

            const subjects = [];
            for (const id of want) {
                const node = built.resolve(id);
                if (!node) { subjects.push({ id, visible: false }); continue; }
                node.updateWorldMatrix(true, true);
                box.setFromObject(node, true);
                if (box.isEmpty()) { subjects.push({ id, visible: node.visible }); continue; }
                /**
                 * All EIGHT corners, projected.
                 *
                 * The same lesson `staging3d` records: a long object seen
                 * end-on has a centre comfortably in frame and both ends off
                 * it. A box is not its centre.
                 */
                let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
                let behindCount = 0;
                for (let c = 0; c < 8; c++) {
                    v.set(c & 1 ? box.max.x : box.min.x,
                          c & 2 ? box.max.y : box.min.y,
                          c & 4 ? box.max.z : box.min.z);
                    const cam = v.clone().applyMatrix4(built.camera.matrixWorldInverse);
                    if (cam.z > -1e-4) behindCount++;
                    v.project(built.camera);
                    const sx = v.x * 0.5 + 0.5;
                    const sy = -v.y * 0.5 + 0.5;
                    x0 = Math.min(x0, sx); x1 = Math.max(x1, sx);
                    y0 = Math.min(y0, sy); y1 = Math.max(y1, sy);
                }
                if (behindCount === 8) {
                    subjects.push({ id, visible: node.visible, behind: true });
                    continue;
                }
                // Sample inside the box, clamped to the frame: the statistic
                // is about the pixels you can actually see.
                const px0 = Math.max(0, Math.floor(x0 * 192));
                const px1 = Math.min(191, Math.ceil(x1 * 192));
                const py0 = Math.max(0, Math.floor(y0 * 108));
                const py1 = Math.min(107, Math.ceil(y1 * 108));
                const luma = [];
                const px = [];
                for (let y = py0; y <= py1; y++) {
                    for (let x = px0; x <= px1; x++) {
                        const i = (y * 192 + x) * 4;
                        const L = lumaAt(i);
                        luma.push(L);
                        px.push([L, img[i], img[i + 1], img[i + 2]]);
                    }
                }
                /**
                 * The MODE of the per-pixel hue, over the object's lit
                 * pixels -- now `dominantHue` in `core/script/digest.js`, so
                 * the 2D path gets this answer from the same code rather
                 * than a second copy of it.
                 *
                 * "What colour is this?" is a question about the MOST COMMON
                 * colour, not the mean one -- a mean of blue and white is
                 * grey, and nothing in the frame is grey. So each lit pixel
                 * is classified and the winner reported, which is robust to
                 * both the background and the highlights and costs one pass.
                 *
                 * "Lit" is 20% of the object's own peak: a threshold relative
                 * to the subject rather than an absolute one, so it works on
                 * a dim planet and a glowing core alike.
                 */
                const hue = dominantHue(px);
                subjects.push({
                    id, visible: node.visible, box: [x0, y0, x1, y1], luma, hue,
                });
            }
            out.push(frameDigest({
                t, shotId, frame: all, subjects,
                overlay: overlay
                    ? overlayAt(overlay, t, { width, height, project, measure })
                    : [],
                blend: blendAt(drawnTransitions, t),
            }));
        }
        poser.reset();
        return { digests: out, duration: compiled.duration,
                 diagnostics: compiled.diagnostics };
    }

    // Grab single frames at given times. The cheapest way to check that a
    // model looks like the thing it is meant to be, which no measurement does.
    if (opts.grab) {
        const out = [];
        for (const t of opts.grab) {
            warmTo(t);
            backend.renderFrame();
            out.push({ t, png: backend.canvas().toDataURL('image/png') });
        }
        poser.reset();
        return { frames: out, duration: compiled.duration, diagnostics: compiled.diagnostics };
    }

    /**
     * The encoder, chosen the way the 2D studio chooses it.
     *
     * This page hardcoded `MediaRecorderSink` -- WebM/VP9, paced in REAL
     * TIME, with a hard ceiling of 1000/fps ms per frame. So the 3D path
     * could not produce an MP4 at all (the format every platform actually
     * wants), and a 3D render took at least as long as the film runs. The
     * muxer and the WebCodecs sink have both been here since Phase 27;
     * nothing on this page had ever called them.
     *
     * MP4 means H.264 specifically. `pickCodec` would otherwise happily
     * return vp09, which is legal in an MP4 container and undecodable on
     * most phones.
     */
    const format = opts.format ?? 'auto';
    let sink = null;
    let encoder = '';
    if (opts.probe) {
        sink = new MemorySink();
        encoder = 'memory (probe)';
    } else {
        const container = format === 'webm' ? 'webm' : 'mp4';
        const muxerFactory = format === 'webm' ? null : mp4MuxerFactory;
        const canWebCodecs = format !== 'webm'
            && await WebCodecsSink.available({ muxerFactory, container, width, height });
        if (canWebCodecs) {
            sink = new WebCodecsSink({ muxerFactory, container });
            encoder = 'WebCodecs H.264/mp4';
        } else if (format === 'mp4') {
            // Asked for MP4 by name. Falling back to WebM silently hands back
            // a file with the wrong extension's worth of expectations on it.
            throw new Error('MP4 was requested but this browser cannot encode H.264 '
                + 'through WebCodecs. Use format: "webm".');
        } else {
            sink = new MediaRecorderSink({
                videoBitsPerSecond: opts.bitrate ?? 12_000_000, audioContext });
            encoder = 'paced MediaRecorder webm';
        }
    }
    report(`encoder: ${encoder}`);
    sink.audioBuffer = audioBuffer;

    const blob = await renderOffline({
        scene: compiled.scene, timeline: compiled.timeline, backend,
        cameraId: compiled.cameraId, fps: compiled.meta.fps,
        width, height, durationSec: opts.durationSec ?? compiled.duration,
        sink, poser, motionBlur: compiled.meta.motionBlur,
        // Aiming the camera and solving the particles both happen after the
        // pose is written and before the frame is drawn. `frameTime` is set
        // here because the overlay is drawn inside `renderFrame`, which the
        // loop calls without a time argument.
        beforeFrame: (t) => { frameTime = t; built.step(t); postAt(t); },
        onProgress: (p) => report(`frame ${p.frame}/${p.total} ${p.msPerFrame.toFixed(1)}ms/f`),
    });

    /**
     * Parked on the page, not returned.
     *
     * A multi-megabyte data URL crosses the CDP boundary TRUNCATED WITH NO
     * ERROR, which writes a short file that looks like a successful render
     * until you try to open it. `produce.mjs` learned this on the 2D path and
     * reads the bytes back in 4 MB chunks with a length check; this page
     * returned a data URL for the whole film, so the 3D path has had a latent
     * truncation bug for every film large enough to hit it. A fifty-second
     * 1280x720 WebM was 8 MB and survived; a sixty-second 1920x1080 MP4 is
     * not, which is how the Earth test found it.
     */
    if (blob && !opts.probe) {
        window.__film = new Uint8Array(await blob.arrayBuffer());
    }

    return {
        mime: sink.mimeType ?? blob?.type ?? '', chunks: sink.chunks?.length ?? 0,
        encoder,
        type: blob?.type ?? sink.mimeType ?? '',
        supported: typeof MediaRecorder !== 'undefined'
            ? ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
                .filter((m) => MediaRecorder.isTypeSupported(m)) : [],
        duration: compiled.duration,
        nodes: compiled.scene.byId.size,
        tracks: compiled.timeline.tracks.length,
        particles: [...compiled.emitters.values()].reduce((a, e) => a + e.emitter.count, 0),
        constraints: compiled.constraints.length,
        models: Object.keys(models).length,
        textures: textures.size,
        clipPlanes: built.clipPlanes.length,
        overlayItems: overlay?.items.length ?? 0,
        subtitles: overlay?.subtitles.length ?? 0,
        sims: built.sims.length,
        post: post ? post.passes : [],
        diagnostics: compiled.diagnostics,
        cues: cues.length,
        lines: compiled.lipsyncJobs?.length ?? 0,
        audioSec: audioBuffer ? +audioBuffer.duration.toFixed(2) : 0,
        size: window.__film?.length ?? blob?.size ?? 0,
    };
};

/** Read the parked film back in chunks. Same contract as the 2D path. */
window.readFilmChunk = function readFilmChunk(offset, length) {
    const bytes = window.__film;
    if (!bytes) throw new Error('no film on the page');
    const slice = bytes.subarray(offset, offset + length);
    let s = '';
    // In 32k runs: String.fromCharCode(...a_million_args) overflows the stack.
    for (let i = 0; i < slice.length; i += 0x8000) {
        s += String.fromCharCode(...slice.subarray(i, i + 0x8000));
    }
    return { base64: btoa(s), length: slice.length,
             done: offset + slice.length >= bytes.length };
};
window.ready3d = true;
</script>
